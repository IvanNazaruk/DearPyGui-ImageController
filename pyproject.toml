[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "DearPyGui_ImageController"
version = "1.0.1"
description = "Loads DearPyGui images only while they are visible"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "IvanNazaruk" }]
requires-python = ">=3.9"
dependencies = ["dearpygui", "pillow"]

[tool.setuptools]
packages = ["DearPyGui_ImageController"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
